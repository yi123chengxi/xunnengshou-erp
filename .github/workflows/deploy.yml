name: build-and-deploy

# CI 回传诊断日志需要向本仓库推送 [skip ci] 提交
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: '回滚目标(tag/commit/分支), 留空表示 main'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # secrets 上下文不能用于 step 级 if:，先在 job 级映射到 env 再供条件与脚本使用
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_ref || 'main' }}
          fetch-depth: 1

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建后端
        run: |
          cd server
          npm ci
          npm run build

      - name: 前端类型检查与单测门禁
        # 位于构建之前：财务口径纯函数单测与 tsc 失败即中止，不产出部署包、不触碰服务器
        run: |
          cd client
          { npx tsc --noEmit && CI=true npx react-scripts test --watchAll=false --ci; } 2>&1 | tee quality.log
          exit ${PIPESTATUS[0]}
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          GENERATE_SOURCEMAP: 'false'

      - name: 构建前端
        id: build_fe
        continue-on-error: true
        run: |
          cd client
          { npm ci && npm run build; } 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        env:
          # 超大 bundle 在 runner 默认堆内存下易 OOM；关闭 sourcemap 降低内存与耗时
          NODE_OPTIONS: '--max-old-space-size=6144'
          GENERATE_SOURCEMAP: 'false'

      - name: 失败时回传前端构建日志供诊断
        if: steps.build_fe.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          if [ -f client/build.log ]; then cp client/build.log ci-logs/fe_build.log; else echo "build.log missing (failed before tee)" > ci-logs/fe_build.log; fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs/fe_build.log
          git commit -m "chore: 回传 CI 前端构建日志 [skip ci]" || true
          git push origin HEAD:main || true

      - name: 前端构建失败判定
        if: steps.build_fe.outcome == 'failure'
        run: exit 1

      - name: 打包部署物
        run: |
          rm -rf pkg
          mkdir -p pkg/nginx pkg/client pkg/server/downloads
          # cp -r server pkg/server 在 pkg/server 已存在时会嵌套成 pkg/server/server，导致部署陈旧外层残留；改用内容级复制
          cp -r server/. pkg/server/
          rm -rf pkg/server/node_modules pkg/server/data pkg/server/downloads pkg/server/uploads pkg/server/logs pkg/server/server
          cp -r client/build pkg/client/build
          # 打印客户端安装包：从 print-client/release/ 复制（若存在）
          if [ -f print-client/release/xunnengshou-print-client-setup.exe ]; then
            cp print-client/release/xunnengshou-print-client-setup.exe pkg/server/downloads/
            cp print-client/release/latest.yml pkg/server/downloads/ 2>/dev/null || true
            cp print-client/release/xunnengshou-print-client-setup.exe.blockmap pkg/server/downloads/ 2>/dev/null || true
            echo "Print client installer included in deploy package"
          else
            echo "WARNING: print-client/release/ not found, skipping installer deployment"
          fi
          cp ecosystem.config.js pkg/
          cp nginx/factory-management.conf pkg/nginx/
          cp server-update.sh pkg/
          cp server-setup.sh pkg/
          # 打包结构自检：入口产物必须位于外层，且不得存在嵌套 server/server
          test -f pkg/server/dist/app.js || { echo 'FATAL: pkg/server/dist/app.js 缺失，打包结构异常'; exit 1; }
          test ! -e pkg/server/server || { echo 'FATAL: pkg/server/server 嵌套异常'; exit 1; }
          tar -czf factory-deploy.tar.gz -C pkg .

      - name: 留存产物7天(供手动回滚下载)
        uses: actions/upload-artifact@v4
        with:
          name: factory-deploy
          path: factory-deploy.tar.gz
          retention-days: 7

      - name: 部署 SSH 公钥到服务器
        if: ${{ env.SERVER_HOST != '' && env.SERVER_PASSWORD != '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "mkdir -p ~/.ssh && echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMk0RUL8zD0PN3pcUPAXRMETNreo/8nS1ZukI169ZmSv administrator@WIN-05FCNDG4A1L' >> ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys"
      
      - name: 部署到阿里云 ECS
        if: ${{ env.SERVER_HOST != '' && env.SERVER_PASSWORD != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null factory-deploy.tar.gz root@${SERVER_HOST}:/root/factory-deploy.tar.gz
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "mkdir -p /root/factory-deploy && tar -xzf /root/factory-deploy.tar.gz -C /root/factory-deploy && bash /root/factory-deploy/server-update.sh"

      - name: 未配置密钥提示
        if: ${{ env.SERVER_HOST == '' || env.SERVER_PASSWORD == '' }}
        run: echo "未配置 SERVER_HOST / SERVER_PASSWORD, 本次仅构建不部署。请到仓库 Settings -> Secrets and variables -> Actions 添加。"
