name: diag
# 临时诊断：核对 dataset_store 各租户关键键的服务端副本体量与数据库磁盘状态；结果推送到 diag-out 分支，用完即删
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: 采集
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          cat > /tmp/diag.sh <<'SH'
          set +e
          source /var/www/factory-management/server/.env 2>/dev/null
          export MYSQL_PWD="$DB_PASSWORD"
          M="mysql -h $DB_HOST -P ${DB_PORT:-3306} -u $DB_USER $DB_NAME -N"
          echo "===== 1. date/uptime/disk ====="
          date
          timeout 10 $M -e "SHOW GLOBAL STATUS LIKE 'Uptime'" 2>&1
          echo "===== 2. write probe ====="
          s=$(date +%s%3N); timeout 20 $M -e "CREATE TABLE IF NOT EXISTS __diag_probe (id INT PRIMARY KEY) ENGINE=InnoDB" 2>&1; e=$(date +%s%3N); echo "create_ms=$((e-s)) rc=$?"
          timeout 20 $M -e "DROP TABLE IF EXISTS __diag_probe" 2>&1
          echo "===== 3. key sizes (bytes) ====="
          timeout 20 $M -e "SELECT dataset_key, LENGTH(dataset_json) AS bytes, updated_at, FROM_UNIXTIME(updated_at/1000) AS ut FROM dataset_store WHERE dataset_key LIKE 'pageData_sales_order-manage%' OR dataset_key LIKE 'customers%' OR dataset_key LIKE 'pageData_customer_bill-detail%' OR dataset_key='registeredUsers' OR dataset_key LIKE 'purchaser_suppliers_%' OR dataset_key LIKE 'purchaser_bills_%' OR dataset_key LIKE 'newstyle_progress_%' ORDER BY updated_at DESC LIMIT 60" 2>&1
          echo "===== 4. totals ====="
          timeout 20 $M -e "SELECT COUNT(*) AS rows_all, SUM(LENGTH(dataset_json)) AS bytes_all FROM dataset_store" 2>&1
          echo "===== 5. app recent errors ====="
          pm2 logs factory-management-server --lines 200 --nostream 2>&1 | grep -iE 'disk is full|Lock wait|ENOSPC|/dataset PUT error' | tail -10
          SH
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "bash -s" < /tmp/diag.sh > diag_out.txt 2>&1
          wc -l diag_out.txt
      - name: 推送结果到 diag-out 分支
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git checkout -b diag-out
          git add -f diag_out.txt
          git commit -m "chore: diag output (temporary)" || true
          git push -f origin HEAD:diag-out
