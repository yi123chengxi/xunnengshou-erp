name: diag
# 临时诊断工作流：确认数据库写入能力并在必要时清理过期 binlog 释放磁盘；结果推送到 diag-out 分支，用完即删
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: 采集并处理
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          cat > /tmp/diag.sh <<'SH'
          set +e
          source /var/www/factory-management/server/.env 2>/dev/null
          export MYSQL_PWD="$DB_PASSWORD"
          M="mysql -h $DB_HOST -P ${DB_PORT:-3306} -u $DB_USER $DB_NAME -N"
          echo "===== 1. basic ====="
          timeout 10 $M -e "SELECT NOW(), @@version, @@global.innodb_lock_wait_timeout" 2>&1
          echo "===== 2. data size inventory (MB) ====="
          timeout 20 $M -e "SELECT table_schema, ROUND(SUM(data_length+index_length)/1048576) AS mb, COUNT(*) AS tbls FROM information_schema.TABLES GROUP BY table_schema ORDER BY mb DESC" 2>&1
          timeout 20 $M -e "SELECT COUNT(*) FROM dataset_store" 2>&1
          echo "===== 3. write test (before) ====="
          s=$(date +%s%3N); timeout 25 $M -e "CREATE TABLE IF NOT EXISTS __diag_probe (id INT PRIMARY KEY, v VARCHAR(8)) ENGINE=InnoDB" 2>&1; e=$(date +%s%3N); echo "create_ms=$((e-s))"
          s=$(date +%s%3N); timeout 25 $M -e "REPLACE INTO __diag_probe VALUES (1,'x')" 2>&1; e=$(date +%s%3N); echo "write_ms=$((e-s))"
          timeout 25 $M -e "DROP TABLE IF EXISTS __diag_probe" 2>&1
          echo "===== 4. binlog purge attempt ====="
          timeout 20 $M -e "SHOW BINARY LOGS" 2>&1 | tail -5
          timeout 30 $M -e "PURGE BINARY LOGS BEFORE DATE_SUB(NOW(), INTERVAL 2 DAY)" 2>&1; echo "purge_rc=$?"
          echo "===== 5. write test (after purge) ====="
          s=$(date +%s%3N); timeout 25 $M -e "CREATE TABLE IF NOT EXISTS __diag_probe2 (id INT PRIMARY KEY, v VARCHAR(8)) ENGINE=InnoDB" 2>&1; e=$(date +%s%3N); echo "create2_ms=$((e-s))"
          s=$(date +%s%3N); timeout 25 $M -e "REPLACE INTO __diag_probe2 VALUES (1,'y')" 2>&1; e=$(date +%s%3N); echo "write2_ms=$((e-s))"
          timeout 25 $M -e "DROP TABLE IF EXISTS __diag_probe2" 2>&1
          echo "===== 6. lock state ====="
          timeout 20 $M -e "SELECT COUNT(*) AS others FROM information_schema.PROCESSLIST WHERE id<>CONNECTION_ID() AND user='$DB_USER'" 2>&1
          timeout 20 $M -e "SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected','Threads_running','Innodb_row_lock_current_waits','Innodb_row_lock_waits','Uptime')" 2>&1
          echo "===== 7. app errors (last 5 min) ====="
          pm2 logs factory-management-server --lines 300 --nostream 2>&1 | grep -iE 'disk is full|ENOSPC|Lock wait|ER_|/dataset PUT error' | tail -25
          SH
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "bash -s" < /tmp/diag.sh > diag_out.txt 2>&1
          wc -l diag_out.txt
      - name: 推送结果到 diag-out 分支
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git checkout -b diag-out
          git add -f diag_out.txt
          git commit -m "chore: diag output (temporary)" || true
          git push -f origin HEAD:diag-out
