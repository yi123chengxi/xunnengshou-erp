name: diag
# 临时诊断工作流：SSH 到 ECS 采集数据库/进程状态，写入前端静态目录后由浏览器读取，用完即删
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: 采集服务器状态
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          cat > /tmp/diag.sh <<'SH'
          set +e
          OUT=/var/www/factory-management/client/build/diag.txt
          {
            echo "== date =="; date
            echo "== uptime =="; uptime
            echo "== mem =="; free -m
            echo "== disk =="; df -h
            echo "== pm2 =="; pm2 list 2>&1
            echo "== pm2 log tail =="; pm2 logs factory-management-server --lines 60 --nostream 2>&1 | tail -80
            echo "== mysql probe =="
            cat > /tmp/diagdb.js <<'JS'
          const fs = require('fs');
          const env = {};
          try {
            fs.readFileSync('/var/www/factory-management/server/.env', 'utf8').split(/\r?\n/).forEach((l) => {
              const m = l.match(/^\s*([A-Za-z0-9_]+)\s*=\s*(.*)\s*$/);
              if (m) env[m[1]] = m[2].replace(/^["']|["']$/g, '');
            });
          } catch (e) { console.log('env read fail', e.message); }
          const base = '/var/www/factory-management/server/node_modules/';
          const mysql = require(base + 'mysql2/promise');
          const hardTimer = setTimeout(() => { console.log('HARD_TIMEOUT 25s'); process.exit(0); }, 25000);
          (async () => {
            let c;
            try {
              c = await mysql.createConnection({
                host: env.DB_HOST, port: Number(env.DB_PORT) || 3306,
                user: env.DB_USER, password: env.DB_PASSWORD, database: env.DB_NAME,
                connectTimeout: 8000,
              });
              console.log('connected ok');
              const run = async (label, sql) => {
                try {
                  const [rows] = await Promise.race([
                    c.query(sql),
                    new Promise((_, rej) => setTimeout(() => rej(new Error('query timeout 10s')), 10000)),
                  ]);
                  console.log('--- ' + label + ' ---');
                  console.log(JSON.stringify(rows, null, 1).slice(0, 4000));
                } catch (e) { console.log('--- ' + label + ' FAILED: ' + e.message + ' ---'); }
              };
              await run('processlist', "SELECT ID,USER,HOST,DB,COMMAND,TIME,STATE,LEFT(INFO,100) AS INFO FROM information_schema.PROCESSLIST ORDER BY TIME DESC LIMIT 30");
              await run('table_status', "SELECT TABLE_NAME,ENGINE,TABLE_ROWS,ROUND(DATA_LENGTH/1048576) AS data_mb,ROUND(INDEX_LENGTH/1048576) AS idx_mb FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('dataset_store','registered_users','owner_usage','system_settings')");
              await run('meta_timing', "SELECT COUNT(*) AS keys_cnt FROM dataset_store");
              await run('meta_indexes', "SELECT INDEX_NAME,COLUMN_NAME,SEQ_IN_INDEX FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='dataset_store' ORDER BY INDEX_NAME,SEQ_IN_INDEX");
              await run('innodb_trx', "SELECT trx_id,trx_state,trx_started,trx_rows_locked,TIMESTAMPDIFF(SECOND,trx_started,NOW()) AS age_s,LEFT(trx_query,80) AS q FROM information_schema.INNODB_TRX LIMIT 10");
            } catch (e) {
              console.log('connect/probe fail: ' + e.message);
            } finally {
              clearTimeout(hardTimer);
              try { await c.end(); } catch (e) { /* ignore */ }
              process.exit(0);
            }
          })();
          JS
            timeout 40 node /tmp/diagdb.js 2>&1
          } > $OUT 2>&1
          chmod 644 $OUT
          echo DIAG_DONE
          SH
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "bash -s" < /tmp/diag.sh
