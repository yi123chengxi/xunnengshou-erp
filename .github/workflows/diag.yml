name: diag

# 临时诊断通道：SSH 到生产 ECS 用应用自身 .env + mysql2 只读取证订单桶行级字段，
# 结果经 diag-out 分支回传。用完即删（工作流与远端分支）。
on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: 采集
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          cat > diag_probe.js <<'JS'
          const fs = require('fs');
          const env = {};
          fs.readFileSync('/var/www/factory-management/server/.env', 'utf8').split(/\r?\n/).forEach(l => {
            const m = l.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/); if (m) env[m[1]] = m[2].trim();
          });
          const mysql = require('/var/www/factory-management/server/node_modules/mysql2/promise');
          (async () => {
            const c = await mysql.createConnection({
              host: env.DB_HOST, port: Number(env.DB_PORT || 3306), user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectTimeout: 8000,
            });
            const [ks] = await c.query("SELECT dataset_key, LENGTH(dataset_json) AS bytes, updated_at FROM dataset_store WHERE dataset_key LIKE 'pageData_sales_order-manage_%' ORDER BY dataset_key");
            console.log('KEYS ' + JSON.stringify(ks));
            for (const k of ks) {
              const [rs] = await c.query('SELECT dataset_json FROM dataset_store WHERE dataset_key = ?', [k.dataset_key]);
              let rows = [];
              try { rows = JSON.parse((rs[0] && rs[0].dataset_json) || '[]'); } catch (e) { console.log('PARSE_FAIL ' + k.dataset_key); continue; }
              if (!Array.isArray(rows)) { console.log('NOT_ARRAY ' + k.dataset_key); continue; }
              console.log('BUCKET ' + k.dataset_key + ' rows=' + rows.length);
              if (rows[0]) console.log('FIELDS ' + Object.keys(rows[0]).join(','));
              rows.forEach((r, i) => console.log('R' + i + ' ' + JSON.stringify({
                id: r.id, key: r.key, no: r.orderNo || r.orderNumber || '', st: r.status || r.orderStatus || '',
                ct: r.createTime || r.createdAt || '', pt: r.payTime || '', owner: r.owner || r.dataOwner || '',
              })));
            }
            const [w] = await c.query("SELECT dataset_key, LENGTH(dataset_json) AS bytes FROM dataset_store WHERE dataset_key LIKE 'pageData_%' AND dataset_key LIKE '%\\_' AND (dataset_key LIKE '%\\_\\_' OR dataset_key REGEXP '_[a-z0-9]{6,}$') ORDER BY bytes DESC LIMIT 40");
            console.log('OTHER ' + JSON.stringify(w));
            await c.end();
          })().catch(e => { console.log('ERR ' + e.message); });
          JS
          cat > remote.sh <<'SH'
          node /root/diag_probe.js > /root/diag_out.txt 2>&1 || true
          SH
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null diag_probe.js remote.sh root@${SERVER_HOST}:/root/ || exit 1
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "bash /root/remote.sh" || true
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST}:/root/diag_out.txt diag_out.txt || echo "ERR scp back" > diag_out.txt

      - name: 回传结果
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f diag_out.txt
          git commit -m "chore: diag out [skip ci]" || true
          git push origin HEAD:diag-out
