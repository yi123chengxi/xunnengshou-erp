name: diag
# 临时诊断工作流：SSH 到 ECS 采集数据库/进程状态，写入前端静态目录后由浏览器读取，用完即删
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: 清理阻塞会话
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          cat > /tmp/diag.sh <<'SH'
          set +e
          OUT=/var/www/factory-management/client/build/diag3.txt
          source /var/www/factory-management/server/.env 2>/dev/null
          export MYSQL_PWD="$DB_PASSWORD"
          M="mysql -h $DB_HOST -P ${DB_PORT:-3306} -u $DB_USER $DB_NAME -N"
          {
            echo "== grants =="; timeout 10 $M -e "SHOW GRANTS FOR CURRENT_USER()" 2>&1
            echo "== before: non-waiting sessions =="
            timeout 12 $M -e "SHOW FULL PROCESSLIST" 2>&1 | cut -c1-150 | grep -v 'etadata lock' | head -20
            echo "== kill 651 (ALTER) =="; timeout 10 $M -e "KILL 651" 2>&1; echo "rc=$?"
            sleep 4
            echo "== kill 630 (4h stuck INSERT) =="; timeout 10 $M -e "KILL 630" 2>&1; echo "rc=$?"
            sleep 8
            echo "== after: processlist summary =="
            timeout 12 $M -e "SHOW FULL PROCESSLIST" 2>&1 | cut -c1-150 > /tmp/pl.txt; wc -l /tmp/pl.txt
            grep -c 'etadata lock' /tmp/pl.txt
            head -25 /tmp/pl.txt
            echo "== counters =="
            timeout 10 $M -e "SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected','Threads_running','Aborted_clients')" 2>&1
            echo "== quick read test =="
            timeout 10 $M -e "SELECT COUNT(*) FROM dataset_store" 2>&1
          } > $OUT 2>&1
          chmod 644 $OUT
          echo DIAG3_DONE
          SH
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${SERVER_HOST} "bash -s" < /tmp/diag.sh
