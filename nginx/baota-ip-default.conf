# 讯能手 ERP —— IP 直连兜底入口（宝塔面板默认站点）
# 用途：服务器装了宝塔面板后，80 端口的默认站点（server_name _）归面板所有，
# 会把 /api/* 全部返回「没有找到站点」，存量按 IP 直连的客户端与网页全部失效。
# 本文件由 server-update.sh 投递到 /www/server/panel/vhost/nginx/0.default.conf，
# 保留 IP 上真正的服务能力：API/WebSocket/上传件/客户端安装包照常从本机 3000 出，
# 其余页面请求 301 到已备案域名（https://www.xns114.com），避免 IP 与域名双份内容。
# 注意：宝塔主配置只 include /www/server/panel/vhost/nginx/*.conf，
# 不加载 /etc/nginx/sites-enabled，因此仓库的 factory-management.conf 在面板机器上不会生效。
server
{
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /uploads {
        alias /var/www/factory-management/server/uploads;
    }

    location /downloads {
        alias /var/www/factory-management/server/downloads;
    }

    location / {
        return 301 https://www.xns114.com$request_uri;
    }

    access_log /www/wwwlogs/ip-default.log;
    error_log /www/wwwlogs/ip-default.error.log;
}
