server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    # index.html 禁止缓存：否则浏览器启发式缓存旧 shell，部署后仍跑旧 bundle（表现为“修复已上线但行为依旧”）
    location = /index.html {
        root /var/www/factory-management/client/build;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # asset-manifest.json 同 index.html 随构建变化，禁止缓存
    location = /asset-manifest.json {
        root /var/www/factory-management/client/build;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # 带内容哈希的静态产物：长期强缓存
    location /static/ {
        root /var/www/factory-management/client/build;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root /var/www/factory-management/client/build;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /uploads {
        alias /var/www/factory-management/server/uploads;
    }

    location /downloads {
        alias /var/www/factory-management/server/downloads;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}